[package]
name = "spork-patch"
description = "Partial patches for line-level staging in Spork (pure, no I/O)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Only the decoders the image diff viewer needs (M08 §3); default features are off
# so the crate stays small.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "ico",
] }
