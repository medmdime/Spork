[package]
name = "spork-git"
description = "Spork's git runner and repository readers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"

[dev-dependencies]
tempfile = "3"
spork-patch = { path = "../spork-patch" }
